  <script>
    // Applied before paint so the stored theme and motion preference never flash.
    (function () {
      try {
        var raw = localStorage.getItem('mat-ex-state');
        var s = raw ? JSON.parse(raw) : {};
        var theme = s.themePref || 'light';
        if (theme === 'system') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.lang = s.lang === 'ru' ? 'ru' : 'en';
        document.documentElement.dataset.lang = document.documentElement.lang;
        if (s.reduceMotion) document.documentElement.dataset.reduceMotion = 'true';
        document.documentElement.classList.add('js');
      } catch (e) {}
    })();
  </script>
</head>
